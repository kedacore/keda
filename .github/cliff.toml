[remote.github]
owner = "" # populated via GITHUB_REPO env var
repo  = ""
token = "" # populated via GITHUB_TOKEN env var

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
{% set group_name = group | striptags | trim -%}
## {{ group_name }}
{% if group_name == "Dependencies" -%}
<details>
<summary>Show</summary>

{% endif -%}
{% for commit in commits | sort(attribute="remote.pr_title") -%}
{% set title = commit.remote.pr_title | default(value=commit.message | split(pat="\n") | first) | trim -%}
{% set title_parts = title | split(pat=":") -%}
{% set component = title_parts | first | trim -%}
{% set display_component = component | replace(from="**", to="") -%}
{% if display_component == "General" -%}
{% set description = title_parts | slice(start=1) | join(sep=":") | trim -%}
- [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}) : **{{ display_component }}**{% if description %}: {{ description }}{% endif %}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }})){% endif %}{% if commit.remote.username %} (@{{ commit.remote.username }}){% endif %}
{% endif -%}
{% endfor -%}
{% for commit in commits | sort(attribute="remote.pr_title") -%}
{% set title = commit.remote.pr_title | default(value=commit.message | split(pat="\n") | first) | trim -%}
{% set title_parts = title | split(pat=":") -%}
{% set component = title_parts | first | trim -%}
{% set display_component = component | replace(from="**", to="") -%}
{% if display_component != "General" -%}
{% set description = title_parts | slice(start=1) | join(sep=":") | trim -%}
- [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}) : **{{ display_component }}**{% if description %}: {{ description }}{% endif %}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }})){% endif %}{% if commit.remote.username %} (@{{ commit.remote.username }}){% endif %}
{% endif -%}
{% endfor %}
{% if group_name == "Dependencies" -%}
</details>{{ "\n" }}
{% endif -%}
{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
commit_parsers = [
  { field = "remote.pr_labels", pattern = "skip-changelog",      skip = true },
  { field = "remote.pr_labels", pattern = "kind/breaking-change", group = "<!-- 0 -->Breaking Changes" },
  { field = "remote.pr_labels", pattern = "kind/deprecation",     group = "<!-- 1 -->Deprecations" },
  { field = "remote.pr_labels", pattern = "kind/feature",         group = "<!-- 2 -->New" },
  { field = "remote.pr_labels", pattern = "kind/new-scaler",      group = "<!-- 2 -->New" },
  { field = "remote.pr_labels", pattern = "kind/improvement",     group = "<!-- 3 -->Improvements" },
  { field = "remote.pr_labels", pattern = "kind/bug",             group = "<!-- 4 -->Fixes" },
  { field = "remote.pr_labels", pattern = "kind/chore",           group = "<!-- 5 -->Other" },
  { field = "remote.pr_labels", pattern = "kind/documentation",   group = "<!-- 5 -->Other" },
  { field = "remote.pr_labels", pattern = "kind/ci",              group = "<!-- 5 -->Other" },
  { field = "remote.pr_labels", pattern = "kind/dependencies",    group = "<!-- 6 -->Dependencies" },
  # fallback for cherry-picks and commits where GitHub PR label lookup fails
  { message = ".*", group = "<!-- 7 -->Unlabeled" },
]
