name: Cherry Pick

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cherry-pick:
    name: Cherry Pick
    # Only run on PR comments (not issue comments) that start with /cherry-pick
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cherry-pick ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_CHERRY_PICK_BOT_ID }}
          private-key: ${{ secrets.GH_CHERRY_PICK_BOT_PRIVATE_KEY }}

      - name: Verify commenter is in keda-core-contributors
        id: checkCoreContributors
        uses: tspascoal/get-user-teams-membership@b2546c5affc730fd8e3d8483ae9ad3621938c2f9 # v4.0.2
        with:
          username: ${{ github.actor }}
          team: "keda-core-contributors"
          GITHUB_TOKEN: ${{ secrets.GH_CHECKING_USER_AUTH }}

      - name: Verify commenter is in keda-core-maintainers
        id: checkCoreMaintainers
        uses: tspascoal/get-user-teams-membership@b2546c5affc730fd8e3d8483ae9ad3621938c2f9 # v4.0.2
        with:
          username: ${{ github.actor }}
          team: "keda-core-maintainers"
          GITHUB_TOKEN: ${{ secrets.GH_CHECKING_USER_AUTH }}

      - name: Fail if commenter is not in allowed teams
        if: steps.checkCoreContributors.outputs.isTeamMember == 'false' && steps.checkCoreMaintainers.outputs.isTeamMember == 'false'
        run: |
          echo "::error::@${{ github.actor }} is not a member of keda-core-contributors or keda-core-maintainers."
          exit 1

      - name: Parse target branch
        id: parse
        run: |
          target=$(echo "${{ github.event.comment.body }}" | sed 's|/cherry-pick[[:space:]]*||' | tr -d '[:space:]')
          if [[ -z "$target" ]]; then
            echo "::error::No target branch specified. Usage: /cherry-pick release/vX"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Get merge commit SHA
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pr.data.merged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Cannot cherry-pick: PR is not merged yet.',
              });
              core.setFailed('PR is not merged');
            }
            core.setOutput('title', pr.data.title);
            return pr.data.merge_commit_sha;

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Cherry-pick commit onto target branch
        id: cp
        env:
          TARGET: ${{ steps.parse.outputs.target }}
          COMMIT: ${{ steps.pr.outputs.result }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="cherry-pick-${PR_NUMBER}-to-${TARGET//\//-}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git fetch origin "$TARGET"
          git checkout -b "$branch" "origin/$TARGET"

          if git cherry-pick -x "$COMMIT"; then
            # --force because re-running the command should overwrite the previous attempt
            git push --force origin "$branch"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR or report failure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TARGET: ${{ steps.parse.outputs.target }}
          BRANCH: ${{ steps.cp.outputs.branch }}
          SUCCESS: ${{ steps.cp.outputs.success }}
          COMMIT: ${{ steps.pr.outputs.result }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const target = process.env.TARGET;
            const success = process.env.SUCCESS === 'true';
            const branch = process.env.BRANCH;
            const commit = process.env.COMMIT;
            const prNumber = parseInt(process.env.PR_NUMBER);

            if (!success) {
              const manualSteps = [
                '```bash',
                `git fetch origin ${target}`,
                `git checkout -b ${branch} origin/${target}`,
                `git cherry-pick -x ${commit}`,
                '# resolve conflicts, then:',
                `git push origin ${branch}`,
                '```',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `Cherry-pick to \`${target}\` failed due to conflicts. Manual steps:\n\n${manualSteps}`,
              });
              core.setFailed('Cherry-pick had conflicts');
              return;
            }

            const prTitle = process.env.PR_TITLE;
            const prBody = `Cherry-pick of #${prNumber} to \`${target}\`.\n\nRequested by @${context.actor} via \`/cherry-pick\` command.`;

            // Upsert PR: update open, or create new (closed PRs cannot be reopened after force-push).
            let pr;
            const existingOpen = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: target,
              state: 'open',
            });
            if (existingOpen.data.length > 0) {
              pr = (await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existingOpen.data[0].number,
                title: prTitle,
                body: prBody,
              })).data;
            } else {
              pr = (await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: branch,
                base: target,
                body: prBody,
              })).data;
            }

            // Carry over kind/* labels to the cherry-pick PR.
            const originalLabels = context.payload.issue.labels
              .map((label) => label.name)
              .filter((labelName) => labelName.startsWith('kind/'));
            // e.g. release/v2.20 -> cherry-pick:v2.20
            const version = target.replace(/^release\//, '');
            const branchLabel = `cherry-pick:${version}`;

            // Create the cherry-pick label if it does not exist yet.
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: branchLabel,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: branchLabel,
                color: 'e4e669',
              });
            }

            // Apply kind/* labels to the cherry-pick PR.
            if (originalLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: originalLabels,
              });
            }

            // Apply cherry-pick:vX label to the original PR to track which branches were targeted.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [branchLabel],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Cherry-pick PR created: #${pr.number}`,
            });
